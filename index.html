<title>SmartHR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: auth split screen; once signed in, a dark grouped nav rail (modules like Rippling's app menu), sticky top bar with global search, inbox and account menu, and a work area of full-page views with tabs. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --ink:#13201d; --muted:#5b6a66; --line:#dce3df;
  --accent:#0e6a5a; --accent-ink:#ffffff; --accent-soft:#dff0ea; --sun:#e9a21b;
  --good:#17803d; --good-soft:#dcf2e3; --warn:#a8650a; --warn-soft:#fbecc9; --bad:#b4352a; --bad-soft:#f9dedb;
  --rail:#10231f; --rail-ink:#e4eeea; --rail-muted:#8ea39d; --rail-line:#223833;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Instrument Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1513; --surface:#132320; --ink:#e6efec; --muted:#93a8a2; --line:#233a35;
  --accent:#3ccaa9; --accent-ink:#06211b; --accent-soft:#143a32; --sun:#f0b43c;
  --good:#52c47d; --good-soft:#12361f; --warn:#e8b05a; --warn-soft:#3a2b0e; --bad:#f08073; --bad-soft:#3d1a16;
  --rail:#0a1211; --rail-ink:#e4eeea; --rail-muted:#7f948e; --rail-line:#1a2d29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1513; --surface:#132320; --ink:#e6efec; --muted:#93a8a2; --line:#233a35;
  --accent:#3ccaa9; --accent-ink:#06211b; --accent-soft:#143a32; --sun:#f0b43c;
  --good:#52c47d; --good-soft:#12361f; --warn:#e8b05a; --warn-soft:#3a2b0e; --bad:#f08073; --bad-soft:#3d1a16;
  --rail:#0a1211; --rail-ink:#e4eeea; --rail-muted:#7f948e; --rail-line:#1a2d29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 10px;font:700 20px var(--f-display)}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--sun);display:grid;place-items:center;color:#10231f;font:700 14px var(--f-display);font-style:normal}
.cmp{margin:0 4px 8px;padding:8px 10px;border-radius:8px;background:var(--rail-line);font-size:12px;color:var(--rail-muted)}
.cmp b{display:block;color:var(--rail-ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted);padding:12px 10px 4px}
.rail a.nv{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--rail-muted);text-decoration:none;font-weight:500}
.rail a.nv:hover{color:var(--rail-ink);background:var(--rail-line)}
.rail a.nv[aria-current=page]{background:var(--rail-line);color:var(--rail-ink);box-shadow:inset 3px 0 0 var(--sun)}
.dot{background:var(--sun);color:#10231f;border-radius:99px;font:600 11px var(--f-mono);padding:1px 7px}
.col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--surface)}
.search{flex:1;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--muted);cursor:pointer;text-align:left}
.search kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--surface)}
.tb-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.ibtn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:16px}
.ibtn .dot{position:absolute;top:-6px;right:-6px}
.menu-btn{display:none}
.pop{position:relative}
.panel{position:absolute;right:0;top:46px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);z-index:40;padding:8px}
.panel[hidden]{display:none}
.panel h3{font-size:14px;padding:8px 10px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;text-decoration:none;color:var(--ink)}
.mi:hover{background:var(--bg)}.mi small{display:block;color:var(--muted)}
.main{padding-block:24px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:30px}
.top p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small,.lbl{display:block;color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em}
.kpi b{display:block;font:700 32px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.wide{width:100%;text-align:center;padding:10px}
.btn.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--bg)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:600 12px var(--f-body);color:#10231f;flex:none}
.av.lg{width:64px;height:64px;font-size:22px}
.pp{display:flex;align-items:center;gap:10px}.pp small{display:block;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;max-width:100%;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
input[type=range]{padding:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.err{color:var(--bad);font-size:13px;background:var(--bad-soft);border-radius:8px;padding:8px 10px}
.hint{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:9px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.heat{border-collapse:separate;border-spacing:3px}
.heat td,.heat th{padding:0;border:0;text-align:center}
.heat th{padding-bottom:4px;font-size:10px}
.cell{width:26px;height:22px;border-radius:5px;display:block;background:var(--bg)}
.cell.P{background:var(--good)}.cell.L{background:var(--sun)}.cell.A{background:var(--bad)}.cell.V{background:var(--accent-soft);border:1px solid var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ann{padding:12px 0;border-bottom:1px solid var(--line)}.ann:last-child{border:0}
.ann h3{font-size:15px}.ann small{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.5);display:flex;justify-content:flex-end;z-index:50}
.scrim.mid{justify-content:center;align-items:flex-start;padding:8vh 16px 16px}
.drawer{background:var(--surface);width:min(460px,100%);height:100%;overflow:auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 40px 22px;border-left:1px solid var(--line)}
.modal{background:var(--surface);width:min(520px,100%);max-height:84vh;overflow:auto;border-radius:14px;padding:22px;border:1px solid var(--line);height:fit-content}
.drawer h2,.modal h2{font-size:22px;margin-bottom:4px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:12px 0}.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;z-index:80;max-width:90%}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--sun)}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.steps span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps span.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.inb{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.inb:last-child{border:0}
.inb small{color:var(--muted);display:block}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.chk:last-child{border:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font:500 10px var(--f-mono);text-transform:uppercase;color:var(--muted);text-align:center}
.cal .d{min-height:74px;border:1px solid var(--line);border-radius:7px;padding:4px;font-size:11px;overflow:hidden;background:var(--surface)}
.cal .d.off{background:var(--bg);color:var(--muted)}.cal .d.t{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.cal .d b{font:500 11px var(--f-mono)}
.cal .c{display:block;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .c.hol{background:var(--warn-soft);color:var(--warn)}
.org,.org ul{list-style:none;margin:0;padding-left:26px;border-left:1px solid var(--line)}
.org{border:0;padding:0}
.org li{margin:8px 0}
.node{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.node small{display:block;color:var(--muted);font-size:12px}.node:hover{border-color:var(--accent)}
/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh}
.auth-l{background:var(--rail);color:var(--rail-ink);padding:40px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.auth-l h1{font-size:40px;line-height:1.1;max-width:14ch}
.auth-l ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;color:var(--rail-muted)}
.auth-l li b{color:var(--rail-ink);display:block}
.auth-r{padding:40px max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center}
.auth-c{width:min(440px,100%);display:grid;gap:14px}
.auth-c h2{font-size:26px}
.demo{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s}
.pwrow{position:relative}.pwrow button{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--accent);cursor:pointer;font-weight:500}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .menu-btn{display:grid}
  .search kbd{display:none}
  .topbar,.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:25px}
  .auth{grid-template-columns:1fr}.auth-l{padding-block:24px}.auth-l h1{font-size:30px}.auth-l ul{display:none}
  .cal .d{min-height:54px}.cal .c{font-size:10px}
  .dl{grid-template-columns:100px 1fr}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
</style>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=new Date(); today.setHours(0,0,0,0); const TK=dkey(today);
function shift(n){const d=new Date(today);d.setDate(d.getDate()+n);return dkey(d)}
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'–';
const fmtShort=s=>new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const inr=n=>'$'+Math.round(n).toLocaleString('en-US');
const usd2=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
const COLORS=['#9bd8c6','#f2cf8a','#b8c7f0','#f0b5a8','#c9e3a0','#d9b8ea','#a8dbe8'];
const DEPTS=['Executive','Engineering','Product','Design','Sales','Operations','HR','Finance'];
const STATES=['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC'];
const NO_TAX=['TX','FL','WA','NV','TN','SD','WY','AK','NH'];
const QUOTA={PTO:15,Sick:6,Personal:3};
const DEMO_PW='Demo#2026';
const DOCS=[{id:'hb',t:'Employee handbook',s:'Version 4.2 · updated Oct 2026'},{id:'coc',t:'Code of conduct',s:'Version 3.0'},{id:'pto',t:'PTO and holiday policy',s:'Effective Jan 1, 2026'},{id:'sec',t:'Information security policy',s:'Version 2.1 · new this quarter'}];
const TASKS=[
 {id:'w4',t:'Complete federal Form W-4',who:'employee'},{id:'i9',t:'Complete Form I-9, Section 1',who:'employee'},
 {id:'dd',t:'Add direct deposit details',who:'employee'},{id:'hb',t:'Acknowledge the employee handbook',who:'employee'},
 {id:'it',t:'Provision laptop and accounts',who:'admin'},{id:'i9v',t:'Verify I-9 documents within 3 business days',who:'admin'},{id:'bd',t:'Assign an onboarding buddy',who:'admin'}];
function nth(y,m,dow,n){const d=new Date(y,m,1);let c=0;while(true){if(d.getDay()===dow&&++c===n)return d.getDate();d.setDate(d.getDate()+1)}}
function lastMon(y,m){const d=new Date(y,m+1,0);while(d.getDay()!==1)d.setDate(d.getDate()-1);return d.getDate()}
function holidays(y){const k=(m,d)=>y+'-'+pad(m+1)+'-'+pad(d);return {[k(0,1)]:'New Year\'s Day',[k(0,nth(y,0,1,3))]:'MLK Day',[k(1,nth(y,1,1,3))]:'Presidents\' Day',[k(4,lastMon(y,4))]:'Memorial Day',[k(5,19)]:'Juneteenth',[k(6,4)]:'Independence Day',[k(8,nth(y,8,1,1))]:'Labor Day',[k(10,11)]:'Veterans Day',[k(10,nth(y,10,4,4))]:'Thanksgiving',[k(11,25)]:'Christmas Day'}}

/* ---------- Storage ---------- */
const LS='smarthr.db.v3',SSK='smarthr.sess.v3';
const st=(k,store)=>{try{return (store||localStorage).getItem(k)}catch(e){return null}};
const stSet=(k,v,store)=>{try{(store||localStorage).setItem(k,v)}catch(e){}};
const stDel=(k,store)=>{try{(store||localStorage).removeItem(k)}catch(e){}};
let DB=null,SESS=null,AUTH={view:'login',err:'',pending:null,msg:''},route='home',booted=false;
const save=()=>stSet(LS,JSON.stringify(DB));
const C=()=>DB.companies[SESS.cid];
const byId=id=>C().emps.find(e=>e.id===id);
const me=()=>byId(SESS.eid);
const role=()=>me().role;

/* ---------- Crypto ---------- */
const rand=n=>{try{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return Math.random().toString(16).slice(2)+Date.now()}};
async function hashPw(pw,salt){
  try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:60000},k,256);
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of salt+pw)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
async function mkUser(email,pw,cid,eid){const salt=rand(8);return {email:email.toLowerCase(),salt,hash:await hashPw(pw,salt),cid,eid,fail:0,lock:0,active:true}}
const pwScore=p=>{let s=0;if(p.length>=10)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return p.length<10?Math.min(s,1):s};
const pwOk=p=>p.length>=10&&/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/\d/.test(p);
const PWMSG='Use at least 10 characters with upper case, lower case and a number.';

/* ---------- Company data builders ---------- */

    used:f.used||{PTO:0,Sick:0,Personal:0},cls:+f.ctc<60000?'Non-exempt (hourly)':'Exempt (salaried)',

function hbars(items){const w=360,rh=26,h=items.length*rh+6;const m=Math.max(...items.map(i=>i[1]),1);
  if(!items.length)return '<div class="empty">No data yet.</div>';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Bar chart">${items.map((it,i)=>{const y=i*rh+3,bw=Math.max(2,(w-150)*it[1]/m);
  return `<text x="0" y="${y+14}">${esc(it[0])}</text><rect x="95" y="${y+3}" width="${bw}" height="14" rx="3" fill="var(--accent)"/><text x="${101+bw}" y="${y+14}" style="fill:var(--ink)">${it[1]}</text>`}).join('')}</svg>`}
function vbars(items){const w=360,h=150,bw=w/items.length;const m=Math.max(...items.map(i=>i[1]),1);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Joiners by month"><line x1="0" y1="120" x2="${w}" y2="120" stroke="var(--line)"/>${items.map((it,i)=>{const bh=it[1]/m*90;
  return `<rect x="${i*bw+6}" y="${120-bh}" width="${bw-12}" height="${bh}" rx="3" fill="${i===items.length-1?'var(--sun)':'var(--accent)'}"/><text x="${i*bw+bw/2}" y="138" text-anchor="middle">${it[0]}</text>${it[1]?`<text x="${i*bw+bw/2}" y="${114-bh}" text-anchor="middle" style="fill:var(--ink)">${it[1]}</text>`:''}`}).join('')}</svg>`}
function line(vals,labels){const w=360,h=150,l=34,r=10,t=14,b=120;const lo=60,hi=100;const x=i=>l+i*(w-l-r)/(vals.length-1),y=v=>b-(Math.max(v,lo)-lo)/(hi-lo)*(b-t);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Attendance rate trend">${[60,80,100].map(v=>`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v)+4}">${v}%</text>`).join('')}
  <polygon points="${l},${b} ${pts} ${x(vals.length-1)},${b}" fill="var(--accent)" opacity=".13"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="5" fill="var(--sun)" stroke="var(--surface)" stroke-width="2"/>
  ${labels.map((s,i)=>i%3===0||i===labels.length-1?`<text x="${x(i)}" y="142" text-anchor="${i===labels.length-1?'end':'middle'}">${s}</text>`:'').join('')}</svg>`}

async function login(email,pw,remember,silent){
  email=(email||'').trim().toLowerCase();
  if(!validEmail(email)||!pw)return authErr('Enter your work email and password.');
  const u=DB.users.find(x=>x.email===email);
  if(!u)return authErr('Email or password is incorrect.');
  if(u.lock>Date.now())return authErr('Too many failed attempts. Try again in '+Math.ceil((u.lock-Date.now())/60000)+' minute(s).');
  if(!u.active)return authErr('This account is deactivated. Contact your administrator.');
  const h=await hashPw(pw,u.salt);
  if(h!==u.hash){u.fail++;const c=DB.companies[u.cid];if(u.fail>=5){u.lock=Date.now()+15*60000;u.fail=0}
    if(c)audit(c,email,'Failed login attempt');save();return authErr(u.lock>Date.now()?'Too many failed attempts. Account locked for 15 minutes.':'Email or password is incorrect.')}
  const c=DB.companies[u.cid],e=c&&c.emps.find(x=>x.id===u.eid);
  if(!e||e.status==='Terminated')return authErr('This account is no longer active.');
  u.fail=0;SESS={email:u.email,cid:u.cid,eid:u.eid};
  stSet(SSK,JSON.stringify(SESS),remember?localStorage:sessionStorage);if(!remember)stDel(SSK,localStorage);
  audit(c,e.name,'Signed in');save();route=(location.hash||'').slice(1)||'home';AUTH={view:'login',err:'',msg:''};
  render();if(!silent)toast('Welcome back, '+e.name.split(' ')[0]);
}
function logout(){if(SESS){try{log('Signed out')}catch(e){}}SESS=null;stDel(SSK,localStorage);stDel(SSK,sessionStorage);closeD();AUTH={view:'login',err:'',msg:'You have been signed out.'};renderAuth()}

  modal(closeRow('Payslip')+`<p class="hint" style="margin:0 0 10px">${esc(m.name)} · ${period(r)} · paid ${fmtD(r.pay)}</p><h3 style="margin:8px 0">Earnings</h3>${slip([['Regular pay',p.gross]],'Gross pay',p.gross)}<h3 style="margin:14px 0 8px">Deductions</h3>${slip([['Federal income tax',p.fed],['State income tax',p.state],['Social Security (6.2%)',p.ss],['Medicare (1.45%)',p.med],['401(k) contribution ('+m.ben.k401+'%)',p.k401],['Medical, dental, vision',p.health]],'Total deductions',p.tax+p.ben)}<div class="note" style="margin-top:14px">Net pay <b style="float:right;font-family:var(--f-mono)">${usd2(p.net)}</b><div style="color:var(--muted);margin-top:4px">Employer 401(k) match this period: ${usd2(p.gross*.03)}</div></div>`)}
function palette(){
  modal(`<input id="pq" placeholder="Search people or pages" autocomplete="off" style="margin-bottom:10px"><div id="pr"></div>`);$('#pq').focus();palFill('');
}
function palFill(q){q=q.toLowerCase();
  const pages=NAV.flatMap(g=>g[1]).filter(i=>allowed(i[2])).concat([['account','Account and security','all']]).filter(i=>i[1].toLowerCase().includes(q));
  const ppl=C().emps.filter(e=>e.status!=='Terminated'&&(e.name+' '+e.title+' '+e.dept).toLowerCase().includes(q)).slice(0,6);
  $('#pr').innerHTML=(pages.length?`<div class="lbl" style="padding:6px 10px">Pages</div>${pages.map(p=>`<a class="mi" href="#${p[0]}" data-a="closeb">${p[1]}</a>`).join('')}`:'')+(ppl.length?`<div class="lbl" style="padding:6px 10px">People</div>${ppl.map(e=>`<a class="mi" href="#person-${e.id}" data-a="closeb">${esc(e.name)}<small>${esc(e.title)} · ${e.dept}</small></a>`).join('')}`:'')||'<div class="empty">No matches.</div>';
}

/* ---------- Actions ---------- */
function setLeave(id,s){const c=C(),l=c.leaves.find(x=>x.id==id);if(!l)return;l.status=s;
  log('Leave '+s.toLowerCase()+' for '+byId(l.eid).name);toast('Leave '+s.toLowerCase()+' for '+byId(l.eid).name.split(' ')[0]);commit()}
function csv(rows){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}
async function exportCsv(kind){const c=C();let rows,name;
  if(kind==='emps'){name='employees.csv';rows=[['Name','Email','Department','Title','Manager','Location','Start date','Status','Annual salary']].concat(c.emps.map(e=>[e.name,e.email,e.dept,e.title,(byId(e.mgr)||{}).name||'',e.loc,e.join,e.status,e.ctc]))}
  if(kind==='leave'){name='time-off.csv';rows=[['Employee','Type','From','To','Days','Status','Reason']].concat(c.leaves.map(l=>[byId(l.eid).name,l.type,l.from,l.to,l.days,l.status,l.reason]))}
  if(kind==='payroll'){name='payroll-register.csv';rows=[['Employee','Gross','Federal tax','State tax','Social Security','Medicare','401(k)','Benefits','Net']].concat(live().map(e=>{const p=pay(e);return [e.name,p.gross,p.fed,p.state,p.ss,p.med,p.k401,p.health,p.net].map((v,i)=>i?v.toFixed(2):v)}))}
  log('Exported '+name);
  try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data:csv(rows)});toast('Export ready')}catch(e){if(e&&e.code==='declined')return;try{const u=URL.createObjectURL(new Blob([csv(rows)],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Export ready')}catch(x){toast('Download failed.')}}}

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-a]');
  if(!ev.target.closest('.pop'))document.querySelectorAll('.panel').forEach(p=>p.hidden=true);
  if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if(a==='close'){if(ev.target===el)closeD();return}
  if(a==='closeb')return closeD();
  if(a==='auth'){AUTH.pending=AUTH.pending;return authGo(el.dataset.v)}
  if(a==='showpw'){const i=$('#'+id);i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'Show':'Hide';return}
  if(a==='demo')return login(el.dataset.em,DEMO_PW,false);
  if(a==='resetdemo'){stDel(LS);stDel(SSK,localStorage);stDel(SSK,sessionStorage);SESS=null;DB={users:[],companies:{}};await seedDemo();AUTH={view:'login',err:'',msg:'Demo data reset.'};route='home';return renderAuth()}
  if(a==='logout')return logout();
  if(a==='menu'){ev.stopPropagation();const p=$('#p-'+id),was=p.hidden;document.querySelectorAll('.panel').forEach(x=>x.hidden=true);p.hidden=!was;return}
  if(a==='navtoggle')return $('#rail').classList.toggle('open');
  if(a==='palette')return palette();
  if(a==='go'){location.hash=el.dataset.to;return}
  if(a==='setup'){const c=C();
    if(id==='import'){populateSample(c,'s',me().id);checkRun(c);log('Imported sample team');toast('Sample team imported');return commit()}
    if(id==='addemp')return addEmpDrawer();
    if(id==='paysched'){c.paySet=true;log('Confirmed bi-weekly pay schedule');toast('Pay schedule confirmed');return commit()}return}
  if(a==='addemp')return addEmpDrawer();
  if(a==='editemp')return empDrawer(id);
  if(a==='offboard'){const e=byId(id);modal(closeRow('Offboard '+esc(e.name)+'?')+`<p>Their login is deactivated immediately and they move out of the active directory. This is recorded in the audit log.</p><div class="row"><button class="btn no" data-a="offok" data-id="${id}">Offboard employee</button><button class="btn" data-a="closeb">Cancel</button></div>`);return}
  if(a==='offok'){const c=C(),e=byId(id);e.status='Terminated';DB.users.forEach(u=>{if(u.eid===id&&u.cid===c.id)u.active=false});c.emps.forEach(x=>{if(x.mgr===id)x.mgr=e.mgr});log('Offboarded '+e.name);closeD();toast(e.name+' offboarded');return commit()}
  if(a==='ptab'){ptab=id;return render()}
  if(a==='stab'){stab=id;return render()}
  if(a==='task'){const t=el.dataset.t;if(FORMS[t]&&byId(id).id===me().id)return taskModal(id,t);return doTask(id,t)}
  if(a==='review')return revDrawer(id);
  if(a==='approve')return setLeave(id,'Approved');
  if(a==='reject')return setLeave(id,'Rejected');
  if(a==='cancel'){const c=C();c.leaves=c.leaves.filter(l=>l.id!=id);toast('Request withdrawn');return commit()}
  if(a==='calnav'){if(id==='0')calM={y:today.getFullYear(),m:today.getMonth()};else{const d=new Date(calM.y,calM.m+ +id,1);calM={y:d.getFullYear(),m:d.getMonth()}}return render()}
  if(a==='runstep'){runStep=Math.max(1,Math.min(3,runStep+ +id));return render()}
  if(a==='runpay'){const c=C(),d=c.runs.find(r=>r.status==='Draft'),act=live().filter(e=>e.status==='Active'||e.status==='Onboarding'&&e.join<=d.end);
    d.status='Processed';d.count=act.length;d.gross=act.reduce((x,e)=>x+pay(e).gross,0);d.net=act.reduce((x,e)=>x+pay(e).net,0);
    c.runs.push({id:'rd'+Date.now(),start:shift(12),end:shift(25),pay:shift(31),status:'Draft'});c.paySet=true;log('Processed payroll for '+period(d));runStep=1;runOk=false;toast('Payroll submitted for '+act.length+' employees');location.hash='payroll';return commit()}
  if(a==='payslip')return payslipModal(id);
  if(a==='remind'){log('Sent benefits reminder');return toast('Reminder sent to pending employees')}
  if(a==='ack'){const c=C();c.ack[me().id].push(id);log('Acknowledged '+DOCS.find(d=>d.id===id).t);toast('Acknowledged');return commit()}
  if(a==='export')return exportCsv(id);
  if(a==='toggleuser'){const u=DB.users.find(x=>x.eid===id&&x.cid===SESS.cid);u.active=!u.active;log((u.active?'Reactivated':'Deactivated')+' login for '+byId(id).name);return commit()}
  if(a==='invite'){const e=byId(id);log('Sent invite to '+e.email);if(e.status==='Active'){e.status='Active'}return toast('Invite sent to '+e.email+'. In this prototype they can use "Set up your account" on the log in page.')}
  if(a==='saverev'||a==='finrev'){const c=C(),r=c.reviews[id];r.goals.forEach((g,i)=>{const s=$('#g'+i);if(s)g.p=+s.value});
    if($('#rr')){r.rating=+$('#rr').value;r.feedback=$('#rf').value}
    if(a==='finrev'){if(!r.rating){toast('Add a rating before completing the review.');return}r.status='Completed'}
    else if(r.status==='Not started')r.status=id===me().id?'Self review':'Manager review';
    log((a==='finrev'?'Completed':'Updated')+' review for '+byId(id).name);toast(a==='finrev'?'Review completed':'Progress saved');closeD();return commit()}
});
function doTask(eid,tid,data){const c=C(),e=byId(eid),ts=c.onb[eid],t=ts.find(x=>x.id===tid);if(!t)return;t.done=true;
  if(data){if(tid==='w4')e.forms.w4=data;if(tid==='i9')e.forms.i9=data;if(tid==='dd')e.forms.dd=data;if(tid==='hb'){c.ack[eid]=Array.from(new Set((c.ack[eid]||[]).concat('hb')))}}
  log('Onboarding task done: '+t.t+' ('+e.name+')');
  if(ts.every(x=>x.done)){e.status='Active';delete c.onb[eid];toast('Onboarding complete for '+e.name.split(' ')[0])}else toast('Task completed');
  closeD();commit()}
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.aChange==='role'){const e=byId(t.dataset.id);e.role=t.value;log('Changed role of '+e.name+' to '+t.value);toast(e.name.split(' ')[0]+' is now '+({admin:'an HR Admin',manager:'a Manager',employee:'an Employee'}[t.value]));commit()}
  if(t.id==='df'){dirD=t.value;fillEmps()}if(t.id==='sf'){dirS=t.value;fillEmps()}
  if(t.id==='runok'){runOk=t.checked;$('#runbtn').disabled=!runOk}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){dirQ=t.value;fillEmps()}
  if(t.id==='pq')palFill(t.value);
  if(/^g\d$/.test(t.id))$('#gv'+t.id.slice(1)).textContent=t.value+'%';
});
document.addEventListener('submit',async ev=>{
  const f=ev.target,id=f.id;ev.preventDefault();
  const ferr=m=>{const x=f.querySelector('#ferr');if(x)x.innerHTML=`<div class="err" role="alert">${esc(m)}</div>`};
  if(id==='f-login')return login($('#em').value,$('#pw').value,$('#rem').checked);
  if(id==='f-signup'){
    const name=$('#sn').value.trim(),email=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,cn=$('#cn').value.trim();
    if(name.split(' ').length<2||name.length<3)return authErr('Enter your first and last name.');
    if(!validEmail(email))return authErr('Enter a valid work email address.');
    if(/@(gmail|yahoo|hotmail|outlook|icloud)\./.test(email))return authErr('Use your company email address, not a personal one.');
    if(!pwOk(pw))return authErr(PWMSG);if(cn.length<2)return authErr('Enter your company name.');
    if(!$('#tos').checked)return authErr('Accept the Terms of Service to continue.');
    if(DB.users.some(u=>u.email===email))return authErr('An account with this email already exists. Log in instead.');
    AUTH.pending={name,email,pw,cn,size:$('#cs').value,state:$('#st').value,code:String(Math.floor(100000+Math.random()*900000))};AUTH.err='';AUTH.view='verify';return renderAuth()}
  if(id==='f-verify'){const p=AUTH.pending;if($('#vc').value.trim()!==p.code)return authErr('That code is not right. Check it and try again.');
    const c=newCompany(p.cn,p.state,p.size,p.email.split('@')[1]);
    const e=addEmp(c,{name:p.name,dept:'HR',title:'HR Administrator',ctc:90000,role:'admin',email:p.email,loc:'New York, NY',ben:{medical:'PPO',dental:true,vision:false,k401:4,done:true}});
    c.anns.push({id:1,t:'Welcome to '+p.cn+' on SmartHR',b:'Your workspace is live. Invite your team from the Directory.',by:p.name,d:TK,tag:'People'});
    checkRun(c);audit(c,p.name,'Company account created');DB.companies[c.id]=c;DB.users.push(await mkUser(p.email,p.pw,c.id,e.id));save();
    AUTH.pending=null;route='home';location.hash='home';await login(p.email,p.pw,true,true);return toast('Welcome to SmartHR. Your workspace is ready.')}
  if(id==='f-join'){const email=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;
    if(!validEmail(email))return authErr('Enter a valid work email address.');if(!pwOk(pw))return authErr(PWMSG);
    if(DB.users.some(u=>u.email===email))return authErr('This email already has an account. Log in instead.');
    let hit=null;for(const c of Object.values(DB.companies)){const e=c.emps.find(x=>x.email===email&&x.status==='Onboarding');if(e)hit={c,e}}
    if(!hit)return authErr('No pending invite found for that email. Ask your administrator to send one.');
    DB.users.push(await mkUser(email,pw,hit.c.id,hit.e.id));audit(hit.c,hit.e.name,'Accepted invite and created account');save();return login(email,pw,false)}
  if(id==='f-forgot'){const email=$('#em').value.trim().toLowerCase();if(!validEmail(email))return authErr('Enter a valid email address.');
    const u=DB.users.find(x=>x.email===email);AUTH.pending={email,code:String(Math.floor(100000+Math.random()*900000)),ok:!!u};AUTH.err='';AUTH.view='reset';return renderAuth()}
  if(id==='f-reset'){const p=AUTH.pending,pw=$('#pw').value;
    if(!p.ok||$('#vc').value.trim()!==p.code)return authErr('That code is not valid. Request a new one.');if(!pwOk(pw))return authErr(PWMSG);
    const u=DB.users.find(x=>x.email===p.email);u.salt=rand(8);u.hash=await hashPw(pw,u.salt);u.fail=0;u.lock=0;const c=DB.companies[u.cid];if(c)audit(c,p.email,'Password reset');save();AUTH.pending=null;return authGo('login','Password updated. Log in with your new password.')}
  if(id==='f-pw'){const u=DB.users.find(x=>x.email===SESS.email),cur=$('#cp').value,pw=$('#pw').value,box=$('#pwerr');
    const bad=m=>box.innerHTML=`<div class="err" role="alert">${m}</div>`;
    if(await hashPw(cur,u.salt)!==u.hash)return bad('Your current password is incorrect.');if(!pwOk(pw))return bad(PWMSG);if(pw===cur)return bad('Choose a password you have not used here.');
    u.salt=rand(8);u.hash=await hashPw(pw,u.salt);log('Changed password');save();f.reset();box.innerHTML='';return toast('Password updated')}
  if(id==='lf'){const c=C(),a=$('#lfrom').value,b=$('#lto').value,d=wdays(a,b);
    if(b<a||d<1)return toast('Pick working days with an end date after the start.');
    const t=$('#lt').value;if(d>balance(me(),t))return toast('Not enough '+t+' leave. You have '+balance(me(),t)+' day(s).');
    c.leaves.push({id:c.nextLeave++,eid:me().id,type:t,from:a,to:b,days:d,reason:$('#lr').value.trim(),status:'Pending'});log('Requested '+d+' day(s) of '+t);toast('Request sent to your manager');return commit()}
  if(id==='af'){const c=C();c.anns.unshift({id:Date.now(),t:$('#at').value,b:$('#ab').value,by:me().name,d:TK,tag:$('#atag').value});log('Posted announcement');toast('Announcement published');return commit()}
  if(id==='bf'){const m=me();m.ben={medical:f.med.value==='Waive'?null:f.med.value,dental:$('#bd').checked,vision:$('#bv').checked,k401:+$('#bk').value,done:true};log('Submitted benefits elections');toast('Benefits elections submitted');return commit()}
  if(id==='cf'){const c=C();c.name=$('#cn2').value.trim()||c.name;c.state=$('#cst').value;log('Updated company profile');toast('Company profile saved');return commit()}
  if(id==='nf'||id==='ef'){const c=C(),sal=+$('#nc').value;
    if(sal<20000)return ferr('Enter an annual salary of at least $20,000.');if($('#nn').value.trim().split(' ').length<2)return ferr('Enter a first and last name.');
    if(id==='ef'){const e=byId(f.dataset.id);Object.assign(e,{name:$('#nn').value.trim(),title:$('#nt').value.trim(),dept:$('#nd').value,mgr:$('#nm').value||null,loc:$('#nl').value,ctc:sal,cls:sal<60000?'Non-exempt (hourly)':'Exempt (salaried)'});log('Updated '+e.name);closeD();toast('Changes saved');return commit()}
    const em=$('#ne').value.trim().toLowerCase();if(em&&!validEmail(em))return ferr('Enter a valid email or leave it blank.');
    if(em&&(c.emps.some(x=>x.email===em)||DB.users.some(u=>u.email===em)))return ferr('That email is already in use.');
    const e=addEmp(c,{name:$('#nn').value.trim(),title:$('#nt').value.trim(),dept:$('#nd').value,mgr:$('#nm').value||null,loc:$('#nl').value,ctc:sal,join:$('#ns').value,status:'Onboarding',email:em||undefined});
    log('Added '+e.name+' and sent invite to '+e.email);closeD();toast('Invite sent to '+e.email);location.hash='onboarding';return commit()}
  if(id==='tf'){const eid=f.dataset.eid,t=f.dataset.t,v=k=>{const x=f.querySelector('#'+k);return x?x.value.trim():''};
    if(t==='dd'){if(!/^\d{9}$/.test(v('x2')))return ferr('A routing number has exactly 9 digits.');if(!/^\d{4,17}$/.test(v('x3')))return ferr('Enter the account number using digits only.')}
    if(t==='i9'&&v('x2').length<3)return ferr('Type your full legal name to sign.');
    const data=t==='w4'?{filing:v('x1').split(' ')[0],extra:v('x2')}:t==='i9'?{status:v('x1'),signed:v('x2')}:t==='dd'?{bank:v('x1'),last4:v('x3').slice(-4)}:{ok:true};
    return doTask(eid,t,data)}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')closeD();
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'&&SESS){ev.preventDefault();palette()}
});
window.addEventListener('hashchange',()=>{if(!SESS)return;route=(location.hash||'#home').slice(1);closeD();render();window.scrollTo(0,0)});

/* ---------- Boot ---------- */
(async function boot(){
  try{const raw=st(LS);if(raw)DB=JSON.parse(raw)}catch(e){}
  if(!DB||!DB.users||!DB.companies||!DB.companies.demo){DB={users:[],companies:{}};await seedDemo()}
  const raw=st(SSK,sessionStorage)||st(SSK);
  if(raw){try{const s=JSON.parse(raw),u=DB.users.find(x=>x.email===s.email&&x.active),c=u&&DB.companies[u.cid],e=c&&c.emps.find(x=>x.id===u.eid);if(e&&e.status!=='Terminated')SESS={email:u.email,cid:u.cid,eid:u.eid}}catch(e){}}
  route=(location.hash||'#home').slice(1)||'home';
  if(SESS)render();else renderAuth();
})();
})();
</script>
